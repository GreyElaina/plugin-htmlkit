name: Build Wheels
on:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install UV
        uses: astral-sh/setup-uv@v6
      
      - name: Pin Python Version
        run: uv python pin 3.9.13

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux2_28_x86_64:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install UV
        uses: astral-sh/setup-uv@v6
      - name: Pin Python Version
        run: uv python pin 3.9.13
      - name: Build wheels
        run:
          uv build -v
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/*.whl